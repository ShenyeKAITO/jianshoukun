<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QQ · 消息</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #1e1e2e;
      color: #333;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }

    .phone {
      width: 390px; height: 780px;
      background: #e8eaed;
      border-radius: 40px;
      box-shadow: 0 0 0 2px #d0d0d0, 0 0 0 4px #1e1e2e, 0 20px 60px rgba(0,0,0,0.5);
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }

    .notch {
      position: absolute; top: 0; left: 50%;
      transform: translateX(-50%);
      width: 150px; height: 28px;
      background: #e8eaed;
      border-radius: 0 0 18px 18px;
      z-index: 20;
    }
    .notch::after {
      content: ''; position: absolute; top: 8px; left: 50%;
      transform: translateX(-50%);
      width: 10px; height: 10px;
      border-radius: 50%;
      border: 1.5px solid #ccc;
    }

    .status {
      display: flex; justify-content: space-between;
      padding: 32px 24px 6px;
      font-size: 12px; color: #888;
      flex-shrink: 0;
    }
    .status .time { color: #555; font-weight: 600; }

    /* ===== QQ 头部 ===== */
    .qq-header {
      background: #fff;
      padding: 12px 16px;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .qq-header .title {
      font-size: 20px; font-weight: 700; color: #333;
    }
    .qq-header .icons {
      display: flex; gap: 16px; color: #666; font-size: 18px;
    }

    /* 提示 */
    .hint-bar {
      text-align: center;
      padding: 12px 16px 8px;
      font-size: 13px;
      color: #e94560;
      font-weight: 600;
      flex-shrink: 0;
      letter-spacing: 1px;
      background: #fff;
    }

    /* ===== 消息列表 ===== */
    .msg-list {
      flex: 1;
      overflow-y: auto;
      background: #fff;
    }

    .msg-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.15s;
    }
    .msg-item:hover { background: #f8f8f8; }
    .msg-item:active { background: #f0f0f0; }

    .msg-item .avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-right: 12px;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
    }

    .msg-item .info {
      flex: 1; min-width: 0;
    }
    .msg-item .info .name-row {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 4px;
    }
    .msg-item .info .name-row .name {
      font-size: 15px; font-weight: 600; color: #333;
    }
    .msg-item .info .name-row .time {
      font-size: 11px; color: #b0b0b0; flex-shrink: 0; margin-left: 8px;
    }
    .msg-item .info .preview {
      font-size: 13px; color: #999;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .msg-item .badge {
      background: #e94560; color: #fff;
      font-size: 11px; min-width: 20px; height: 20px;
      border-radius: 10px; display: flex;
      align-items: center; justify-content: center;
      padding: 0 6px; margin-left: 8px; flex-shrink: 0;
    }

    /* ===== 底部导航 ===== */
    .bottom-nav {
      display: flex; border-top: 1px solid #e0e0e0;
      background: #fff; flex-shrink: 0;
    }
    .bottom-nav .nav-item {
      flex: 1; text-align: center;
      padding: 8px 0; font-size: 11px; color: #999;
      cursor: pointer; transition: color 0.2s;
    }
    .bottom-nav .nav-item.active { color: #2196F3; }
    .bottom-nav .nav-item .nav-icon { font-size: 18px; display: block; margin-bottom: 2px; }

    @media (max-width: 420px) {
      .phone { width: 340px; height: 700px; }
    }
  </style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>

  <div class="status">
    <span class="time">12:15</span>
    <span>📶 🔋</span>
  </div>

  <!-- QQ 头部 -->
  <div class="qq-header">
    <span class="title">QQ</span>
    <span class="icons">➕ ⋯</span>
  </div>

  <!-- 消息列表 -->
  <div class="msg-list">

    <!-- QQ收藏夹 -->
    <div class="msg-item" id="qqFavorites">
      <div class="avatar" style="background:#fdcb6e;">⭐</div>
      <div class="info">
        <div class="name-row">
          <span class="name">QQ收藏夹</span>
        </div>
        <div class="preview">收藏的聊天记录、图片、文件等</div>
      </div>
    </div>

    <!-- 谢砚 -->
    <div class="msg-item" id="chatFriend2">
      <div class="avatar" style="background:url('9.png') center/cover;"></div>
      <div class="info">
        <div class="name-row">
          <span class="name">谢砚</span>
          <span class="time">9月28日</span>
        </div>
        <div class="preview">有吗 哥哥想多了吧</div>
      </div>
    </div>

    <!-- BLC万能局 -->
    <div class="msg-item" id="chatGroup2">
      <div class="avatar" style="background:#a29bfe; border-radius:12px;">🫧</div>
      <div class="info">
        <div class="name-row">
          <span class="name">BLC吹泡泡 <span style="font-size:11px;color:#bbb;font-weight:400;">(1589)</span></span>
          <span class="time">9月24日</span>
        </div>
        <div class="preview">代发B：1＝0，哥等弟走骨科……</div>
      </div>
    </div>

    <!-- 亲友A -->
    <div class="msg-item" id="chatFriend1">
      <div class="avatar" style="background:#e84393;"></div>
      <div class="info">
        <div class="name-row">
          <span class="name">亲友A</span>
          <span class="time">9月20日</span>
        </div>
        <div class="preview">爱你</div>
      </div>
    </div>

    <!-- 亲友小群 -->
    <div class="msg-item" id="chatGroup3">
      <div class="avatar" style="background:#2c3e50; border-radius:12px;">🌙</div>
      <div class="info">
        <div class="name-row">
          <span class="name">0.5偏1只做0 <span style="font-size:11px;color:#bbb;font-weight:400;">(3)</span></span>
          <span class="time">8月26日</span>
        </div>
        <div class="preview">亲友B：可以可以，服了你</div>
      </div>
    </div>

  </div>

  <!-- 底部导航 -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <span class="nav-icon">💬</span>消息
    </div>
    <div class="nav-item" style="cursor:default;">
      <span class="nav-icon">👥</span>联系人
    </div>
    <div class="nav-item" id="navDynamics">
      <span class="nav-icon">📱</span>动态
    </div>
    <div class="nav-item" id="navProfile">
      <span class="nav-icon">👤</span>我的
    </div>
  </div>
</div>

<script>
(function(){
  var GS;
  try {
    if (window.opener && window.opener.GS) GS = window.opener.GS;
    else if (window.GS) GS = window.GS;
  } catch(e) {}
  if (!GS) {
    GS = {
      get: function(k){ try{return JSON.parse(localStorage.getItem('game2_'+k))}catch(e){return null} },
      set: function(k,v){ localStorage.setItem('game2_'+k,JSON.stringify(v)) },
      addClue: function(id){ var c=this.get('clues')||[]; if(!c.includes(id)){c.push(id);this.set('clues',c)} },
      unlockPage: function(id){ var u=this.get('unlockedPages')||[]; if(!u.includes(id)){u.push(id);this.set('unlockedPages',u)} }
    };
  }

  // 点击消息项
  document.getElementById('qqFavorites').addEventListener('click', function(){
    window.open('qq_favorites.html', '_blank');
  });
  document.getElementById('chatGroup2').addEventListener('click', function(){
    window.open('qq_group2.html', '_blank');
  });
  document.getElementById('chatGroup3').addEventListener('click', function(){
    window.open('qq_group3.html', '_blank');
  });
  document.getElementById('chatFriend1').addEventListener('click', function(){
    window.open('qq_friend1.html', '_blank');
  });
  document.getElementById('chatFriend2').addEventListener('click', function(){
    window.open('qq_friend2.html', '_blank');
  });

  document.getElementById('navDynamics').addEventListener('click', function(){
    window.open('qq_dynamics.html', '_blank');
  });
  document.getElementById('navProfile').addEventListener('click', function(){
    window.open('qq_profile.html', '_blank');
  });
})();
</script>
</body>
</html>
