<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>倒吊人</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #1e1e2e;
      color: #333;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .phone {
      width: 390px; height: 780px;
      background: #ededed;
      border-radius: 40px;
      box-shadow: 0 0 0 2px #d0d0d0, 0 0 0 4px #1e1e2e, 0 20px 60px rgba(0,0,0,0.5);
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }
    .notch {
      position: absolute; top: 0; left: 50%;
      transform: translateX(-50%);
      width: 150px; height: 28px;
      background: #ededed;
      border-radius: 0 0 18px 18px;
      z-index: 20;
    }
    .notch::after {
      content: ''; position: absolute; top: 8px; left: 50%;
      transform: translateX(-50%);
      width: 10px; height: 10px;
      border-radius: 50%;
      border: 1.5px solid #ccc;
    }
    .status {
      display: flex; justify-content: space-between;
      padding: 32px 24px 6px;
      font-size: 12px; color: #888;
      flex-shrink: 0;
    }
    .status .time { color: #555; font-weight: 600; }

    /* 顶栏：标题居中，无返回箭头 */
    .header {
      background: #fff;
      padding: 10px 16px;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
      text-align: center;
    }
    .header .title {
      font-size: 16px; font-weight: 700; color: #333;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
    }
    .chat-body::-webkit-scrollbar { width: 3px; }
    .chat-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

    /* ===== 聊天消息 ===== */
    .msg-row {
      display: flex;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .msg-row.me { justify-content: flex-end; }
    .msg-ava {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #e5e5e5 center/cover;
      flex-shrink: 0;
    }
    .msg-row.me .msg-ava { margin-left: 10px; }
    .msg-row.he .msg-ava { margin-right: 10px; }
    .msg-content {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 280px;
    }
    .msg-tag {
      flex-shrink: 0;
      background: #e6e6e6;
      color: #aaa;
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 9px;
      line-height: 1;
      white-space: nowrap;
    }
    .msg-bubble {
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      color: #333;
      line-height: 1.6;
      background: #fff;
      max-width: 240px;
    }
    .msg-row.me .msg-bubble {
      background: #95ec69;
    }
    .msg-row .msg-bubble.gray {
      background: #cfcfcf;
    }
    .msg-time {
      text-align: center;
      font-size: 12px;
      color: #bbb;
      margin: 4px 0 14px;
      line-height: 1;
    }
    .msg-system {
      text-align: center;
      font-size: 11px;
      color: #b0b0b0;
      margin: 4px 0 14px;
      line-height: 1;
    }

    /* ===== 小程序卡片（同 QQ 里的扫雷分享卡片） ===== */
    .mp-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      width: 220px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.15s;
    }
    .mp-card:hover { transform: scale(1.02); }
    .mp-card:active { transform: scale(0.98); }
    .mp-card .mp-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px 6px;
    }
    .mp-card .mp-header .mp-icon {
      width: 28px; height: 28px;
      border-radius: 6px;
      background: #2d3436;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .mp-card .mp-header .mp-name {
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }
    .mp-card .mp-cover {
      padding: 8px 14px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mp-card .mp-cover .mp-grid {
      display: grid;
      grid-template-columns: repeat(3, 20px);
      grid-template-rows: repeat(3, 20px);
      gap: 2px;
      flex-shrink: 0;
    }
    .mp-card .mp-cover .mp-grid span {
      background: #dfe6e9;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }
    .mp-card .mp-cover .mp-grid span.mine { background: #ff7675; color: #fff; }
    .mp-card .mp-cover .mp-grid span.flag { background: #74b9ff; color: #fff; }
    .mp-card .mp-desc {
      font-size: 11px;
      color: #888;
    }
    .mp-card .mp-desc .mp-label {
      font-size: 10px;
      color: #07C160;
      font-weight: 600;
    }
    .mp-card .mp-footer {
      padding: 8px 14px;
      border-top: 1px solid #f0f0f0;
      font-size: 11px;
      color: #999;
      display: flex;
      justify-content: space-between;
    }

    /* ===== 输入栏上方：上皮说 / 本人说 ===== */
    .speak-switch {
      display: flex;
      align-self: flex-start;
      background: #fff;
      border-radius: 8px;
      padding: 3px;
      margin: 8px 0 6px 12px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.12);
    }
    .speak-switch .ss-opt {
      padding: 5px 12px;
      font-size: 12px;
      color: #bbb;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }
    .speak-switch .ss-opt.active {
      background: #4db6ac;
      color: #fff;
    }

    /* ===== 输入栏 ===== */
    .chat-input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      padding: 8px 12px;
      flex-shrink: 0;
    }
    .chat-input-bar input {
      flex: 1;
      height: 36px;
      border: none;
      background: #f5f5f5;
      border-radius: 18px;
      padding: 0 14px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      color: #333;
    }
    .chat-input-bar input::placeholder { color: #b0b0b0; }
    .chat-input-bar .send-btn {
      height: 36px;
      padding: 0 16px;
      border: none;
      border-radius: 18px;
      background: #d4a373;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>

    <div class="status">
      <span class="time">12:15</span>
      <span>📶 🔋</span>
    </div>

    <div class="header">
      <div class="title">倒吊人</div>
    </div>

    <div class="chat-body">
      <div class="msg-time">8月27日1:23</div>

      <!-- 他：最近感觉压力好大...... -->
      <div class="msg-row he">
        <div class="msg-ava" style="background:#6c5ce7"></div>
        <div class="msg-content">
          <div class="msg-bubble">最近感觉压力好大......</div>
        </div>
      </div>

      <!-- 我：怎么了？ -->
      <div class="msg-row me">
        <div class="msg-content">
          <div class="msg-bubble">怎么了？</div>
        </div>
        <div class="msg-ava" style="background-image:url('14.jpg')"></div>
      </div>

      <!-- 他：恩...一些家事，不方便说吧 -->
      <div class="msg-row he">
        <div class="msg-ava" style="background:#6c5ce7"></div>
        <div class="msg-content">
          <div class="msg-bubble">恩...一些家事，不方便说吧</div>
        </div>
      </div>

      <!-- 我：我压力大的时候喜欢玩扫雷，感觉很解压 -->
      <div class="msg-row me">
        <div class="msg-content">
          <div class="msg-bubble">我压力大的时候喜欢玩扫雷，感觉很解压</div>
        </div>
        <div class="msg-ava" style="background-image:url('14.jpg')"></div>
      </div>

      <!-- 我：扫雷小程序卡片（同 QQ 里的扫雷分享卡片） -->
      <div class="msg-row me">
        <div class="msg-content">
          <div class="mp-card" id="mpSaolei">
            <div class="mp-header">
              <div class="mp-icon">💣</div>
              <span class="mp-name">扫雷</span>
            </div>
            <div class="mp-cover">
              <div class="mp-grid">
                <span></span><span class="mine">💣</span><span></span>
                <span class="flag">🚩</span><span></span><span></span>
                <span></span><span></span><span></span>
              </div>
              <div class="mp-desc">
                <div class="mp-label">小程序</div>
                <div>经典扫雷小游戏</div>
              </div>
            </div>
            <div class="mp-footer">
              <span>扫雷</span>
              <span>点击体验 →</span>
            </div>
          </div>
        </div>
        <div class="msg-ava" style="background-image:url('14.jpg')"></div>
      </div>

      <!-- 我：这是我自己做的小程序，要试试吗？ -->
      <div class="msg-row me">
        <div class="msg-content">
          <div class="msg-bubble">这是我自己做的小程序，要试试吗？</div>
        </div>
        <div class="msg-ava" style="background-image:url('14.jpg')"></div>
      </div>

      <!-- 他：好呀好呀，欸那个secret模式是什么？ -->
      <div class="msg-row he">
        <div class="msg-ava" style="background:#6c5ce7"></div>
        <div class="msg-content">
          <div class="msg-bubble">好呀好呀，欸那个secret模式是什么？</div>
        </div>
      </div>

      <!-- 我：哈哈，秘密啦！ -->
      <div class="msg-row me">
        <div class="msg-content">
          <div class="msg-bubble">哈哈，秘密啦！</div>
        </div>
        <div class="msg-ava" style="background-image:url('14.jpg')"></div>
      </div>

      <!-- 他：不管怎么样还是谢谢你 -->
      <div class="msg-row he">
        <div class="msg-ava" style="background:#6c5ce7"></div>
        <div class="msg-content">
          <div class="msg-bubble">不管怎么样还是谢谢你</div>
        </div>
      </div>
    </div>

    <div class="speak-switch">
      <span class="ss-opt active">上皮说</span>
      <span class="ss-opt">本人说</span>
    </div>
    <div class="chat-input-bar">
      <input type="text" placeholder="输入消息…">
      <button class="send-btn">发送</button>
    </div>
  </div>

  <script>
    (function(){
      /* 上皮说 / 本人说 切换（必选一个） */
      var ssOpts = document.querySelectorAll('.speak-switch .ss-opt');
      ssOpts.forEach(function(opt){
        opt.addEventListener('click', function(){
          ssOpts.forEach(function(o){ o.classList.remove('active'); });
          this.classList.add('active');
        });
      });

      /* 扫雷小程序卡片 → 打开扫雷游戏 */
      var mp = document.getElementById('mpSaolei');
      if (mp) {
        mp.addEventListener('click', function(){
          window.open('saolei.html', '_blank');
        });
      }
    })();
  </script>
</body>
</html>
