<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QQ收藏夹</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height: 100%;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #1e1e2e;
      color: #333;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .phone {
      width: 390px; height: 780px;
      background: #f5f5f5;
      border-radius: 40px;
      box-shadow: 0 0 0 2px #d0d0d0, 0 0 0 4px #1e1e2e, 0 20px 60px rgba(0,0,0,0.5);
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }
    .notch {
      position: absolute; top: 0; left: 50%;
      transform: translateX(-50%);
      width: 150px; height: 28px;
      background: #f5f5f5;
      border-radius: 0 0 18px 18px;
      z-index: 20;
    }
    .notch::after {
      content: ''; position: absolute; top: 8px; left: 50%;
      transform: translateX(-50%);
      width: 10px; height: 10px;
      border-radius: 50%;
      border: 1.5px solid #ccc;
    }
    .status {
      display: flex; justify-content: space-between;
      padding: 32px 24px 6px;
      font-size: 12px; color: #888;
      flex-shrink: 0;
    }
    .status .time { color: #555; font-weight: 600; }

    .header {
      background: #fff;
      padding: 10px 16px;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header .back {
      font-size: 22px; color: #555; cursor: pointer;
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      transition: background 0.15s;
    }
    .header .back:hover { background: #f0f0f0; }
    .header .info { flex: 1; }
    .header .info .name { font-size: 16px; font-weight: 700; color: #333; }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      background: #f5f5f5;
    }

    .folder-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 4px 14px;
      font-size: 13px;
      color: #999;
      border-bottom: 1px solid #e0e0e0;
      margin-bottom: 12px;
    }
    .folder-header .icon { font-size: 16px; }

    .doc-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 12px;
      background: #fff;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .doc-item:hover { background: #f8f8f8; }
    .doc-item:active { background: #f0f0f0; }

    .doc-icon {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: #ffeaa7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .doc-info { flex: 1; min-width: 0; }
    .doc-info .doc-name {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }
    .doc-info .doc-meta {
      font-size: 12px;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>

    <div class="status">
      <span class="time">12:15</span>
      <span>📶 🔋</span>
    </div>

    <div class="header">
      <div class="back" onclick="window.close()">‹</div>
      <div class="info">
        <div class="name">QQ收藏夹</div>
      </div>
    </div>

    <div class="content">
      <div class="folder-header">
        <span class="icon">📁</span>
        <span>全部收藏 · 1项</span>
      </div>

      <div class="doc-item" id="docYuc">
        <div class="doc-icon">📄</div>
        <div class="doc-info">
          <div class="doc-name">语c洗白手册</div>
          <div class="doc-meta">文档</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('docYuc').addEventListener('click', function(){
      window.open('qq_yuc_manual.html', '_blank');
    });
  </script>
</body>
</html>
