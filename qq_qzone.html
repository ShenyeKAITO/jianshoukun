<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>池延的QQ空间</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #1e1e2e;
      color: #333;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }

    .phone {
      width: 390px; height: 780px;
      background: #e8eaed;
      border-radius: 40px;
      box-shadow: 0 0 0 2px #d0d0d0, 0 0 0 4px #1e1e2e, 0 20px 60px rgba(0,0,0,0.5);
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }

    .notch {
      position: absolute; top: 0; left: 50%;
      transform: translateX(-50%);
      width: 150px; height: 28px;
      background: #e8eaed;
      border-radius: 0 0 18px 18px;
      z-index: 20;
    }
    .notch::after {
      content: ''; position: absolute; top: 8px; left: 50%;
      transform: translateX(-50%);
      width: 10px; height: 10px;
      border-radius: 50%;
      border: 1.5px solid #ccc;
    }

    .status {
      display: flex; justify-content: space-between;
      padding: 32px 24px 6px;
      font-size: 12px; color: #888;
      flex-shrink: 0;
    }
    .status .time { color: #555; font-weight: 600; }

    .qzone-body {
      flex: 1;
      overflow-y: auto;
      background: #fff;
    }
    .qzone-body::-webkit-scrollbar { width: 3px; }
    .qzone-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

    /* 顶部栏 */
    .top-bar {
      display: flex; align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid #f0f2f5;
      background: #fff;
      position: sticky; top: 0; z-index: 5;
    }
    .top-bar .title {
      font-size: 16px; font-weight: 600; color: #1a1a1a; flex: 1;
    }

    /* 封面 */
    .qzone-header {
      position: relative;
      height: 160px;
      background: url('5.png') center 60% / cover no-repeat;
    }
    .qzone-header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.3));
      pointer-events: none;
    }
    .qzone-header .avatar-box {
      position: absolute;
      bottom: -32px;
      left: 20px;
      z-index: 2;
    }
    .qzone-header .avatar-box .avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: url('3.jpg') center / cover;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    /* 信息区 */
    .qzone-info {
      padding: 40px 20px 10px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .qzone-info .qzone-name {
      font-size: 18px; font-weight: 700; color: #1a1a1a;
    }
    .qzone-info .qzone-sig {
      font-size: 12px; color: #999;
      padding-left: 14px;
      border-left: 1px solid #e0e0e0;
    }

    /* 说说列表 */
    .feed-section {
      padding: 4px 20px 16px;
    }
    .feed-section .section-title {
      font-size: 14px; font-weight: 600; color: #1a1a1a;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #f0f2f5;
    }
    .feed-item {
      padding: 14px 0;
      border-bottom: 1px solid #f0f2f5;
    }
    .feed-item:last-child { border-bottom: none; }

    .feed-item .feed-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px;
    }
    .feed-item .feed-header .small-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: url('3.jpg') center / cover;
      flex-shrink: 0;
    }
    .feed-item .feed-header .feed-name {
      font-size: 13px; font-weight: 600; color: #333;
    }
    .feed-item .feed-header .feed-time {
      font-size: 11px; color: #bbb;
      margin-left: auto;
    }
    .feed-item .feed-content {
      font-size: 13px; color: #444;
      line-height: 1.7;
      margin-bottom: 6px;
      padding-left: 40px;
    }
    .feed-item .feed-content .text { margin-bottom: 6px; }

    /* 链接卡片 */
    .link-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f7f7f7;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background 0.15s;
      border: 1px solid #eee;
    }
    .link-card:hover { background: #f0f0f0; }
    .link-card .thumb {
      width: 40px; height: 40px;
      border-radius: 6px;
      flex-shrink: 0;
      background: linear-gradient(160deg, #4a4a4a, #222);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 10px;
      text-align: center;
      line-height: 1.3;
      letter-spacing: 1px;
    }
    .link-card .link-info { flex: 1; min-width: 0; }
    .link-card .link-info .lt {
      font-size: 13px; font-weight: 600; color: #333;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .link-card .link-info .ls {
      font-size: 11px; color: #999; margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .feed-item .feed-actions {
      display: flex; gap: 16px;
      font-size: 11px; color: #bbb;
      padding-left: 40px;
    }
    .feed-item .feed-actions span { cursor: pointer; }
    .feed-item .feed-actions span:hover { color: #07C160; }

    @media (max-width: 420px) {
      .phone { width: 340px; height: 700px; }
      .qzone-header { height: 140px; }
    }
  </style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>

  <div class="status">
    <span class="time">12:15</span>
    <span>📶 🔋</span>
  </div>

  <div class="qzone-body">
    <div class="top-bar">
      <span class="title">📱 我的QQ空间</span>
    </div>

    <div class="qzone-header">
      <div class="avatar-box">
        <div class="avatar"></div>
      </div>
    </div>

    <div class="qzone-info">
      <div class="qzone-name">池延</div>
      <div class="qzone-sig">我与我周旋久，宁作我。</div>
    </div>

    <div class="feed-section">
      <div class="section-title">📝 说说</div>

      <div style="text-align:center;padding:40px 0;color:#ccc;font-size:14px;">暂无说说</div>
    </div>
  </div>
</div>

</body>
</html>
