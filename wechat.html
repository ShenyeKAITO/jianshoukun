<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>微信</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #1e1e2e;
      color: #333;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }

    .phone {
      width: 390px; height: 780px;
      background: #e8eaed;
      border-radius: 40px;
      box-shadow: 0 0 0 2px #d0d0d0, 0 0 0 4px #1e1e2e, 0 20px 60px rgba(0,0,0,0.5);
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }

    .notch {
      position: absolute; top: 0; left: 50%;
      transform: translateX(-50%);
      width: 150px; height: 28px;
      background: #e8eaed;
      border-radius: 0 0 18px 18px;
      z-index: 20;
    }
    .notch::after {
      content: ''; position: absolute; top: 8px; left: 50%;
      transform: translateX(-50%);
      width: 10px; height: 10px;
      border-radius: 50%;
      border: 1.5px solid #ccc;
    }

    .status {
      display: flex; justify-content: space-between;
      padding: 32px 24px 6px;
      font-size: 12px; color: #888;
      flex-shrink: 0;
    }
    .status .time { color: #555; font-weight: 600; }

    /* ===== 微信头部 ===== */
    .wx-header {
      background: #2e2e2e;
      padding: 12px 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .wx-header .title {
      font-size: 18px; font-weight: 700; color: #fff;
    }
    .wx-header .icons {
      display: flex; gap: 14px;
    }
    .wx-header .icons span {
      color: #fff; font-size: 16px; cursor: default;
    }
    .wx-header .back-btn {
      color: #fff; font-size: 22px; cursor: pointer;
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; margin-right: 2px;
    }
    .wx-header .back-btn:hover { background: rgba(255,255,255,0.1); }

    /* ===== 搜索栏 ===== */
    .search-bar {
      background: #2e2e2e;
      padding: 0 16px 10px;
      flex-shrink: 0;
    }
    .search-bar input {
      width: 100%;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      background: #1a1a1a;
      color: #ccc;
      outline: none;
      font-family: inherit;
    }
    .search-bar input::placeholder { color: #666; }

    /* ===== 消息列表 ===== */
    .msg-list {
      flex: 1;
      overflow-y: auto;
      background: #1a1a1a;
    }

    .msg-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid #2a2a2a;
    }
    .msg-item:hover { background: #222; }
    .msg-item:active { background: #2a2a2a; }

    .msg-item .avatar {
      width: 48px; height: 48px;
      border-radius: 6px;
      flex-shrink: 0;
      margin-right: 12px;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
      font-weight: 600;
    }

    .msg-item .info {
      flex: 1; min-width: 0;
    }
    .msg-item .info .name-row {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 4px;
    }
    .msg-item .info .name-row .name {
      font-size: 15px; font-weight: 600; color: #e0e0e0;
    }
    .msg-item .info .name-row .time {
      font-size: 11px; color: #666; flex-shrink: 0; margin-left: 8px;
    }
    .msg-item .info .preview {
      font-size: 13px; color: #888;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .msg-item .badge {
      background: #f44336; color: #fff;
      font-size: 11px; min-width: 18px; height: 18px;
      border-radius: 9px; display: flex;
      align-items: center; justify-content: center;
      padding: 0 5px; margin-left: 8px; flex-shrink: 0;
    }

    /* ===== 底部导航 ===== */
    .bottom-nav {
      display: flex;
      background: #2e2e2e;
      flex-shrink: 0;
      border-top: 1px solid #222;
    }
    .bottom-nav .nav-item {
      flex: 1; text-align: center;
      padding: 6px 0 8px;
      font-size: 10px; color: #888;
      cursor: default;
    }
    .bottom-nav .nav-item.active { color: #07C160; }
    .bottom-nav .nav-item .nav-icon {
      font-size: 20px; display: block; margin-bottom: 2px;
    }
    .bottom-nav .nav-item .nav-label { font-size: 10px; }
  </style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>

  <div class="status">
    <span class="time">12:15</span>
    <span>📶 🔋</span>
  </div>

  <!-- 微信头部 -->
  <div class="wx-header">
    <div class="back-btn" onclick="window.close()">‹</div>
    <span class="title">微信</span>
    <span class="icons">
      <span>🔍</span>
      <span>➕</span>
    </span>
  </div>

  <!-- 搜索栏 -->
  <div class="search-bar">
    <input type="text" placeholder="搜索" autocomplete="off">
  </div>

  <!-- 消息列表 -->
  <div class="msg-list">

    <!-- 班级群 -->
    <div class="msg-item" id="chatClass">
      <div class="avatar" style="background:linear-gradient(135deg,#11998e,#38ef7d); flex-direction:column; line-height:1.3; font-size:14px; font-weight:600;">高一<br>7班</div>
      <div class="info">
        <div class="name-row">
          <span class="name">高一（7）班班级群</span>
          <span class="time">9月27日</span>
        </div>
        <div class="preview">语文课代表：收到，明天收齐作业</div>
      </div>
    </div>

  </div>

  <!-- 底部导航 -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <span class="nav-icon">💬</span>
      <span class="nav-label">微信</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">👥</span>
      <span class="nav-label">通讯录</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">🔎</span>
      <span class="nav-label">发现</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">👤</span>
      <span class="nav-label">我</span>
    </div>
  </div>
</div>

<script>
(function(){
  document.getElementById('chatClass').addEventListener('click', function(){
    window.open('wechat_group.html', '_blank');
  });
})();
</script>
</body>
</html>
